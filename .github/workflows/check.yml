name: Tool and Skill checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r tooling/requirements-dev.txt
      - run: .venv/bin/python -B tooling/yunxia.py source fetch
      - run: make check
      - run: make build
      - run: git diff --exit-code
